services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_URL=/api
    container_name: project_s-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      # URL контейнера бэкенда во внутренней сети Docker
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    networks:
      - app-network
    # При добавлении бэкенда раскомментируйте depends_on:
    # depends_on:
    #   - backend

  # =====================================================================
  # Шаблон для подключения бэкенда
  # Когда бэкенд будет добавлен в проект, просто настройте/раскомментируйте
  # этот сервис, и он автоматически окажется в одной сети с фронтендом.
  # =====================================================================
  # backend:
  #   build:
  #     context: ./backend # путь к директории бэкенда
  #     dockerfile: Dockerfile
  #   container_name: project_s-backend
  #   restart: unless-stopped
  #   ports:
  #     - "${BACKEND_PORT:-8000}:8000"
  #   environment:
  #     - PORT=8000
  #     # Дополнительные переменные бэкенда (БД, секреты и т.д.)
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge
    name: project_s-network
